{% extends "shop/base.html" %}

{% block title %}{{ page.title }} | WheyStore{% endblock %}

{% block content %}
<div class="checkout-card" style="max-width: 820px; margin: 0 auto;">
    <h1 style="font-size: 1.75rem; margin-bottom: 8px; color: var(--accent-red);">{{ page.title }}</h1>
    <p style="color: var(--text-muted); margin-bottom: 20px;">{{ page.subtitle }}</p>
    {% for para in page.paragraphs %}
    <p style="line-height: 1.75; color: var(--text-secondary); margin-bottom: 14px;">{{ para }}</p>
    {% endfor %}
</div>
{% endblock %}

<!DOCTYPE html>
<html lang="vi">
<body style="font-family: Arial, sans-serif; background: #181818; color: #f4f4f4; padding: 24px;">
  <div style="max-width: 600px; margin: 0 auto; background: #222222; border: 1px solid #333; border-radius: 10px; padding: 24px;">
    <h2 style="color: #d33f49; margin-top: 0;">WheyStore - Cập Nhật Đơn Hàng #DH{{ order.id }}</h2>
    <p>Xin chào <strong>{{ order.full_name }}</strong>,</p>
    <p>Đơn hàng <strong>#DH{{ order.id }}</strong> của bạn vừa được cập nhật sang trạng thái: <strong>{{ order.get_status_display }}</strong>.</p>
    <p>Tổng giá trị đơn: <strong>{{ order.total_amount|floatformat:0 }}đ</strong>.</p>
  </div>
</body>
</html>
